# ============================================================
#  宠宝树 — Docker Compose 编排文件
#  包含：API 服务 + MySQL + Nginx 反向代理
#
#  使用方法：
#    开发环境：docker-compose up -d
#    生产环境：docker-compose -f docker-compose.prod.yml up -d
# ============================================================

version: "3.8"

services:
  # ── 应用服务 ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chongbaoshu-api
    restart: always
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - ENV=docker
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DB:-chongbaoshu}?charset=utf8mb4
      - WX_PAY_MCH_ID=${WX_PAY_MCH_ID:-}
      - WX_PAY_API_V3_KEY=${WX_PAY_API_V3_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - uploads_data:/opt/chongbaoshu-api/uploads
      - logs_data:/opt/chongbaoshu-api/logs
      - certs_data:/opt/chongbaoshu-api/certs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chongbaoshu-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── MySQL 数据库 ────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: chongbaoshu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chongbaoshu_root_2025}
      MYSQL_DATABASE: ${MYSQL_DB:-chongbaoshu}
      MYSQL_USER: ${MYSQL_USER:-chongbaoshu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chongbaoshu_db_2025}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chongbaoshu-net
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Nginx 反向代理（可选） ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: chongbaoshu-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - chongbaoshu-net
    profiles:
      - with-nginx

# ── 持久化卷 ──────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  certs_data:
    driver: local
  nginx_logs:
    driver: local

# ── 网络 ──────────────────────────────────────────────────
networks:
  chongbaoshu-net:
    driver: bridge
